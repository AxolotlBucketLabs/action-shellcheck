name: "ShellCheck"
author: "AxolotlBucketLabs"
description: "Run ShellCheck on scripts in a repository."
inputs:
  additional_files:
    description: "Space-separated filenames or relative path patterns to check"
    required: false
    default: ""
  all_scripts:
    description: "Check extensionless executable files with any shebang"
    required: false
    default: "false"
  ignore:
    description: "Paths to ignore when running ShellCheck"
    required: false
    default: ""
    deprecationMessage: "Use ignore_paths or ignore_names instead."
  ignore_paths:
    description: "Space-separated paths or glob patterns to ignore"
    required: false
    default: ""
  ignore_names:
    description: "Space-separated filenames or glob patterns to ignore"
    required: false
    default: ""
  ignore_symlinks:
    description: "Skip symbolic links. Set to false to check symbolic links to files"
    required: false
    default: "true"
  only_files:
    description: "Newline-separated file paths to check instead of scanning directories"
    required: false
    default: ""
  severity:
    description: "Minimum severity of errors to consider. Options: [error, warning, info, style]"
    required: false
    default: ""
  check_together:
    description: "Run ShellCheck on all selected files at once"
    required: false
    default: "false"
  scandir:
    description: "Directory to search. Newline-separated directories are supported"
    required: false
    default: "."
  disable_matcher:
    description: "Set to true to disable GitHub annotations for gcc output"
    required: false
    default: "false"
  format:
    description: "Output format (checkstyle, diff, gcc, json, json1, quiet, tty)"
    required: false
    default: "gcc"
  version:
    description: "ShellCheck release version to download, or system to use PATH"
    required: false
    default: "stable"
outputs:
  files:
    description: "Space-separated paths that were checked"
    value: ${{ steps.run.outputs.files }}
  files_list:
    description: "Newline-separated paths that were checked"
    value: ${{ steps.run.outputs.files_list }}
  options:
    description: "ShellCheck options used by the action"
    value: ${{ steps.run.outputs.options }}
branding:
  icon: "terminal"
  color: "gray-dark"
runs:
  using: "composite"
  steps:
    - name: Run ShellCheck
      id: run
      shell: bash
      env:
        INPUT_ADDITIONAL_FILES: ${{ inputs.additional_files }}
        INPUT_ALL_SCRIPTS: ${{ inputs.all_scripts }}
        INPUT_CHECK_TOGETHER: ${{ inputs.check_together }}
        INPUT_DISABLE_MATCHER: ${{ inputs.disable_matcher }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_IGNORE_NAMES: ${{ inputs.ignore_names }}
        INPUT_IGNORE_PATHS: ${{ inputs.ignore_paths }}
        INPUT_IGNORE_SYMLINKS: ${{ inputs.ignore_symlinks }}
        INPUT_ONLY_FILES: ${{ inputs.only_files }}
        INPUT_SCANDIR: ${{ inputs.scandir }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
      run: bash "$ACTION_PATH/scripts/run-shellcheck.sh"
